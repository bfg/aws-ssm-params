name: Native image

on: [push, pull_request, workflow_dispatch]

jobs:
  linux-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-musl: 'true'
          cache: gradle
      - name: Build static binary
        env:
          STATIC_BINARY: 'true'
        run: ./gradlew nativeCompile
      - name: Verify binary
        run: |
          binary=build/native/nativeCompile/aws-ssm-params-env
          file "$binary"
          if readelf -l "$binary" | grep -q INTERP; then
            echo 'Binary has a dynamic loader' >&2
            exit 1
          fi
          "$binary" --help
          commit_id=$(sed -n 's/^git.commit.id.abbrev=//p' build/resources/main/git.properties)
          test "$("$binary" --version)" = "aws-ssm-params-env $commit_id"
      - uses: actions/upload-artifact@v4
        with:
          name: aws-ssm-params-env-linux-amd64
          path: build/native/nativeCompile/aws-ssm-params-env
          if-no-files-found: error
