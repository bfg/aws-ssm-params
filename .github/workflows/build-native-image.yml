#
# Github Actions workflow
#
# SYNTAX: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
#
# IMPORTANT SETTINGS:
# * GH Actions expressions: https://docs.github.com/en/actions/reference/workflows-and-actions/expressions
# * GH Actions contexts:    https://docs.github.com/en/actions/reference/workflows-and-actions/contexts
# * GH Actions variables:   https://docs.github.com/en/actions/reference/workflows-and-actions/variables
# * GH hosted runners:      https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#choosing-github-hosted-runners
#
# MISC:
# * https://github.com/marketplace?type=actions
# * https://stackoverflow.com/a/73061524
# * https://runs-on.com/benchmarks/github-actions-cpu-performance/
#

name: build-native-image

on:
  push:
    # run when commit is pushed to main branch
    branches: [ main ]

    # run when a tag is created
    tags:
      - '**'

  # run when commit is pushed as PR to main
  pull_request:
    branches: [ '**' ]

permissions:
  checks:         write   # used by: mikepenz/action-junit-report
  pull-requests:  write   # used by: mikepenz/action-junit-report
  contents:       write   # used by: softprops/action-gh-release
  discussions:    write   # used by: softprops/action-gh-release

env:
  # print env vars?
  DEBUG_ENV:                    ${{ vars.DEBUG_ENV || 'false' }}

  # should we skip running tests as part of the build? (handled by build.gradle)
  SKIP_TESTS:                   ${{ vars.SKIP_TESTS || 'false' }}

  # build container image?
  BUILD_CONTAINER_IMAGE:        ${{ vars.BUILD_CONTAINER_IMAGE || 'true' }}
  CONTAINER_REGISTRY:           ${{ vars.CONTAINER_REGISTRY || '' }}
  CONTAINER_REPOSITORY:         ${{ vars.CONTAINER_REPOSITORY || '' }}

  # build production ready binary?
  PROD_BINARY:                  ${{ vars.PROD_BINARY || 'true' }}

  # build statically linked binary if supported and possible?
  STATIC_BINARY:                ${{ vars.STATIC_BINARY || 'true' }}

# Use concurrency to ensure that only a single job or workflow using the same concurrency group will
# run at a time. A concurrency group can be any string or expression.
#
# SEE: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency
concurrency:
  group:              ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Builds a project, runs tests and builds a native binary
  build-binary:
    strategy:
      matrix:
        runner: [ ubuntu-26.04, ubuntu-26.04-arm ]

    runs-on: ${{ matrix.runner }}

    outputs:
      CONTAINER_IMG_VERSION:  ${{ steps.define_outputs.outputs.CONTAINER_IMG_VERSION }}
      CONTAINER_IMG_TAG:      ${{ steps.define_outputs.outputs.CONTAINER_IMG_TAG }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          # checkout PR head commit instead of merge commit for PR builds, otherwise checkout ordinary ref
          # SEE: https://github.com/actions/checkout#checkout-pull-request-head-commit-instead-of-merge-commit
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers:    true
          cache-read-only:      false
          cache-cleanup:        on-success

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version:             25
          distribution:             graalvm-community
          check-for-updates:        false
          # NOTE: fully static linking requires musl libc, and this is supported only on linux/x86_64
          native-image-musl:        ${{ runner.os == 'Linux' &&  runner.arch == 'X64' }}
          native-image-job-reports: true
          native-image-pr-reports:  false
          cache:                    gradle
          github-token:             ${{ secrets.GITHUB_TOKEN }}

      - name: Set env variables
        run: |
          echo "OS="$(uname -s | tr '[:upper:]' '[:lower:]') >> "$GITHUB_ENV"
          echo "ARCH="$(uname -m | tr '[:upper:]' '[:lower:]') >> "$GITHUB_ENV"

      - name: Set job output variables
        id:   define_outputs
        run: |
          echo "CONTAINER_IMG_VERSION="$(./gradlew -q dockerImgVersion) >> "$GITHUB_OUTPUT"
          echo "CONTAINER_IMG_TAG="$(./gradlew -q dockerImgTag) >> "$GITHUB_OUTPUT"

      - name: Start compose services
        run: docker compose up -d --quiet-pull --wait

      - name: Display environment variables
        if:   env.DEBUG_ENV == 'true' || contains(github.event.pull_request.labels.*.name, 'debug-env')
        run:  env | sort -k1

      # NOTE: tests are being ran only on linux/x86_64 - no need to run tests on each platform
      - name: Run tests
        if:   env.SKIP_TESTS != 'true' && !contains(github.event.pull_request.labels.*.name, 'skip-tests') && runner.arch == 'X64'
        run: ./gradlew test
        env:
          # NOTE: needed, otherwise tests on gh actions fail due to a non-existing aws credential source
          AWS_ACCESS_KEY_ID:      foo
          AWS_SECRET_ACCESS_KEY:  bar
          AWS_REGION:             us-east-1

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6.4.1
        if:   github.ref_type != 'tag' && env.SKIP_TESTS != 'true' && !contains(github.event.pull_request.labels.*.name, 'skip-tests')  && runner.arch == 'X64' && !cancelled()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'

      - name: Upload build reports in case of test failure
        uses: actions/upload-artifact@v7.0.1
        if:   github.ref_type != 'tag' && env.SKIP_TESTS != 'true' && !contains(github.event.pull_request.labels.*.name, 'skip-tests') && runner.arch == 'X64' && failure()
        with:
          name: build-reports-${{ matrix.runner }}
          retention-days: 21
          path: |
            **/build/reports

      - name: Build application binary
        run: ./gradlew nativeCompile

      - uses: actions/upload-artifact@v7
        with:
          name:               aws-ssm-params-env-${{ env.OS }}-${{ env.ARCH }}
          path:               build/native/nativeCompile/aws-ssm-params-env
          if-no-files-found:  error

  # Builds a multi-platform container image
  container-image:
    needs:  build-binary
    #if:     ${{ vars.BUILD_CONTAINER_IMAGE == 'true' && vars.CONTAINER_REPOSITORY != '' }}
    runs-on: ubuntu-26.04

    env:
      CONTAINER_IMG_VERSION:  ${{ needs.linux-binary.outputs.CONTAINER_IMG_VERSION }}
      CONTAINER_IMG_TAG:      ${{ needs.linux-binary.outputs.CONTAINER_IMG_TAG }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Download x86_64 binary from artifacts
        uses: actions/download-artifact@v8
        with:
          name: aws-ssm-params-env-linux-x86_64
          path: docker/amd64

      - name: Download aarch64 binary from artifacts
        uses: actions/download-artifact@v8
        with:
          name: aws-ssm-params-env-linux-aarch64
          path: docker/arm64

      - name: Display environment variables
        if:   env.DEBUG_ENV == 'true' || contains(github.event.pull_request.labels.*.name, 'debug-env')
        run:  env | sort -k1

      - name: Login to container registry
        run:  |
          docker login --password-stdin \
            -u "${{ secrets.CONTAINER_REGISTRY_USER }}" \
            "${{ env.CONTAINER_REGISTRY}}" <<< "${{ secrets.CONTAINER_REGISTRY_PASS }}"

      - name: Set up Docker Buildx
        run:  docker buildx create --use

      - name: Build container image for verification
        run:  docker buildx build --platform linux/amd64 --load -t "${{ env.CONTAINER_IMG_TAG }}" docker

      - name: Run built container image
        run:  docker run --rm "${{ env.CONTAINER_IMG_TAG }}" --version

      - name: Build and push multi-platform container image
        run:  docker buildx build --platform linux/amd64,linux/arm64 --push -t "${{ env.CONTAINER_IMG_TAG }}" docker

      - name: Tag latest release image
        if:   github.ref_type == 'tag' && !endsWith(env.CONTAINER_IMG_VERSION, '-snapshot')
        run:  docker buildx imagetools create --tag "${CONTAINER_IMG_TAG%:*}:latest" "$CONTAINER_IMG_TAG"

  # Creates GitHub project release + uploads built binaries
  github-release:
    needs: [ build-binary, container-image ]
    if:    github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    steps:
      - name: Download x86_64 binary from artifacts
        uses: actions/download-artifact@v8
        with:
          name: aws-ssm-params-env-linux-x86_64
          path: release

      - name: Move x86_64 binary for release
        run: mv release/aws-ssm-params-env release/aws-ssm-params-env-linux-x86_64

      - name: Download aarch64 binary from artifacts
        uses: actions/download-artifact@v8
        with:
          name: aws-ssm-params-env-linux-aarch64
          path: release-arm64

      - name: Move aarch64 binary for release
        run: mv release-arm64/aws-ssm-params-env release/aws-ssm-params-env-linux-aarch64

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes:   true
          append_body:              true
          fail_on_unmatched_files:  true
          files: |
            release/aws-ssm-params-env-linux-x86_64
            release/aws-ssm-params-env-linux-aarch64

