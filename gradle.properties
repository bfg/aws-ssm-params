#
# gradle.properties
#

# basic project settings
group=com.github.bfg.awsssmparamsenv
version=0.1.2-SNAPSHOT

############################################################
#                     GRADLE SETTINGS                      #
############################################################

# warning mode
#org.gradle.warning.mode=all
org.gradle.warning.mode=none

# SEE: https://docs.gradle.org/current/userguide/build_environment.html#sec:gradle_configuration_properties
org.gradle.caching=true
org.gradle.configureondemand=true

org.gradle.daemon=true
org.gradle.daemon.idletimeout=3600000

# config cache (doesn't work with shadowJar.onlyIf)
#org.gradle.configuration-cache=true
#org.gradle.configuration-cache.problems=warn
#org.gradle.configuration-cache.max-problems=4

############################################################

# The AWS SDK for Java 1.x entered maintenance mode starting July 31, 2024 and will reach end of support on
# December 31, 2025. For more information, see
# https://aws.amazon.com/blogs/developer/the-aws-sdk-for-java-1-x-is-in-maintenance-mode-effective-july-31-2024/
# You can print where on the file system the AWS SDK for Java 1.x core runtime is located by setting the
# AWS_JAVA_V1_PRINT_LOCATION environment variable or aws.java.v1.printLocation system property to 'true'.
aws.java.v1.disableDeprecationAnnouncement=true

